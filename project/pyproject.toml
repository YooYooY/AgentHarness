[project]
name = "project"
version = "0.1.0"
description = "FastAPI + SQLite service for IELTS Food core shadowing passages"
readme = "README.md"
authors = [
    { name = "YooYooY", email = "744534984cwl@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "openai>=2.52.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.3",
]

[project.scripts]
project = "project:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
